        "parameters": [],
        "responses": {
          "200": {
            "description": "Operação concluída; GET retorna o recurso ou coleção."
          },
          "400": {
            "description": "Dados inválidos — Problem Details com detail e errors por campo."
          },
          "401": {
            "description": "Sessão ausente, expirada ou conta indisponível."
          },
          "403": {
            "description": "Perfil, vínculo ou CSRF inválido."
          },
          "404": {
            "description": "Recurso não encontrado."
          },
          "409": {
            "description": "Conflito de estado, unicidade ou reserva."
          },
