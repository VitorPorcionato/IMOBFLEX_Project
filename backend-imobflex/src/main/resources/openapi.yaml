                    "type": "string",
                    "minLength": 1,
                    "maxLength": 1000
                  },
                  "useAi": {
                    "type": "boolean",
                    "default": false
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "reply, links (title/href internos), mode LOCAL ou GROQ"
          },
          "400": {
            "description": "Mensagem inválida ou formato de dado pessoal detectado"
          },
          "403": {
            "description": "CSRF ausente/inválido"
          },
          "413": {
            "description": "Corpo excede 8 KiB"
          },
          "429": {
            "description": "Limite de solicitações atingido"
          }
        }
      }
    }
