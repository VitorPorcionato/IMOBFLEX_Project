      "post": {
        "summary": "Assistente público, somente leitura; IA opcional com autorização explícita",
        "security": [],
        "description": "CSRF obrigatório, corpo máximo 8 KiB, 10 perguntas por minuto/sessão e 60/minuto/instância. Sem chave ou em falha da Groq, retorna orientação LOCAL. Sem histórico de conversa persistido.",
