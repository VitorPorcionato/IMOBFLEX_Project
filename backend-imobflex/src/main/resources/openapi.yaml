  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "SESSION"
      }
    },
    "schemas": {
      "Registration": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120
          },
          "cpf": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "phone": {
            "type": "string",
            "maxLength": 30
          },
          "address": {
            "type": "string",
            "maxLength": 500
          },
          "password": {
            "type": "string",
            "minLength": 8,
            "maxLength": 72
          },
          "terms_accepted": {
            "type": "boolean",
            "const": true
          },
          "terms_version": {
            "type": "string",
            "const": "2026-11-16"
          },
          "marketing": {
            "type": "boolean",
            "default": false
          }
        },
        "required": [
          "name",
          "email",
          "password",
          "terms_accepted",
          "terms_version"
        ]
      },
      "PropertyInput": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "HOUSE",
              "APARTMENT",
              "PENTHOUSE",
              "LAND",
              "COMMERCIAL",
              "WAREHOUSE"
            ]
          },
          "purpose": {
            "type": "string",
            "enum": [
              "SALE",
              "RENT",
              "BOTH"
            ]
          },
          "description": {
            "type": "string"
          },
          "cep": {
            "type": "string"
          },
          "street": {
            "type": "string"
          },
          "number": {
            "type": "string"
          },
          "neighborhood": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "state": {
            "type": "string"
          },
          "sale_price": {
            "type": "string"
          },
          "rent_price": {
            "type": "string"
          },
          "area": {
            "type": "string"
          },
          "bedrooms": {
            "type": "integer",
            "minimum": 0
          },
          "bathrooms": {
            "type": "integer",
            "minimum": 0
          },
          "parking": {
            "type": "integer",
            "minimum": 0
          },
          "owner_id": {
            "type": "integer",
            "minimum": 0
          },
          "broker_id": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "title",
          "type",
          "purpose",
          "description",
          "cep",
          "street",
          "number",
          "neighborhood",
          "city",
          "state",
          "area",
          "bedrooms",
          "bathrooms",
          "parking",
          "owner_id",
          "broker_id"
        ]
      }
    }
  }
