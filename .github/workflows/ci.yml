name: Verify IMOBFLEX
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
        working-directory: backend-imobflex
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-imobflex/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend-imobflex
      - run: npx playwright install --with-deps
        working-directory: frontend-imobflex
      - run: npm run test:e2e
        working-directory: frontend-imobflex
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend-imobflex/test-results/
  fullstack:
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: CiDatabaseOnly25
      MYSQL_ROOT_PASSWORD: CiRootOnly25
      BOOTSTRAP_EMAIL: admin@example.test
      BOOTSTRAP_PASSWORD: AdminPilot2026!
      SPRING_PROFILES_ACTIVE: demo
      DEMO_PASSWORD: DemoPilot2026!
      E2E_URL: http://localhost:3000
      FULL_STACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-imobflex/package-lock.json
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend-imobflex
      - run: npx playwright test tests/e2e/fullstack.spec.js tests/e2e/visual-refresh.spec.js tests/e2e/responsive.spec.js --project=chromium --workers=1
        working-directory: frontend-imobflex
      - run: docker compose logs
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fullstack-test-results
          path: frontend-imobflex/test-results/
